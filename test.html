<!DOCTYPE html>
<html lang="ar" dir="rtl" style="background-color: #000000 !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List ISLAM Ramadan</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* تطبيق الأسود الغامق الحقيقي مباشرة */
        html, body {
            background-color: #000000 !important;
            color: #ffffff !important;
            min-height: 100vh !important;
            margin: 0;
            padding: 0;
        }

        /* كروت رمادية غامقة للتباين */
        .card-custom {
            background-color: #121416 !important;
            border: 1px solid #2a2e33 !important;
        }

        /* كارت تحذير عدم وجود مهام */
        .empty-alert {
            background-color: #2b1d20 !important;
            border: 1px solid #5c2529 !important;
        }

        /* الزر الأخضر */
        .btn-success {
            background-color: #198754 !important;
            border: none !important;
        }

        /* لون العنوان السماوي */
        .text-info {
            color: #0dcaf0 !important;
        }
    </style>
</head>
<body style="background-color: #000000 !important;">

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Title -->
                <div class="text-center mb-4">
                    <h1 class="fw-bold text-info mb-2 fs-2">
                        Welcome To Our ToDo List ISLAM Ramadan
                    </h1>
                </div>

                <!-- Input Card -->
                <div class="card card-custom mb-5 p-2">
                    <div class="card-body p-3">
                        <form id="todoForm" class="text-center">
                            <div class="mb-3 text-start">
                                <label class="form-label text-light fs-6 mb-1">
                                    Enter New Task
                                </label>
                                <input
                                    type="text"
                                    id="taskInput"
                                    class="form-control form-control-lg bg-white text-dark border-0 rounded"
                                    placeholder="Enter New Task"
                                    required
                                />
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-success btn-lg text-white rounded fw-bold">
                                    Button
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Counter -->
                <div class="text-center mb-3">
                    <h2 class="fw-bold text-info fs-3">
                        You Have <span id="taskCount">0</span> Tasks
                    </h2>
                </div>

                <!-- Tasks Box -->
                <div class="card card-custom p-1">
                    <div class="card-body p-3" id="tasksContainer">
                        <div id="noTasksAlert" class="card empty-alert text-center p-4 rounded">
                            <div class="card-body py-0">
                                <p class="mb-0 fs-5 fw-bold text-danger">
                                    No Tasks Added Yet
                                </p>
                            </div>
                        </div>

                        <ul id="taskList" class="list-group d-none"></ul>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        const taskInput = document.getElementById('taskInput');
        const todoForm = document.getElementById('todoForm');
        const taskList = document.getElementById('taskList');
        const noTasksAlert = document.getElementById('noTasksAlert');
        const taskCount = document.getElementById('taskCount');

        let tasks = JSON.parse(localStorage.getItem('todo_tasks')) || [];

        function renderTasks() {
            taskList.innerHTML = '';
            taskCount.textContent = tasks.length;

            if (tasks.length === 0) {
                noTasksAlert.classList.remove('d-none');
                taskList.classList.add('d-none');
            } else {
                noTasksAlert.classList.add('d-none');
                taskList.classList.remove('d-none');

                tasks.forEach((task, index) => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item bg-dark border-secondary text-white d-flex align-items-center justify-content-between p-3 mb-2 rounded';
                    
                    li.innerHTML = `
                        <div class="d-flex align-items-center gap-3">
                            <input 
                                type="checkbox" 
                                class="form-check-input mt-0 bg-dark border-secondary"
                                ${task.completed ? 'checked' : ''} 
                                onchange="toggleTask(${index})"
                                style="width: 1.25em; height: 1.25em; cursor: pointer;"
                            >
                            <span class="${task.completed ? 'text-decoration-line-through text-secondary' : 'text-light'}">
                                ${task.text}
                            </span>
                        </div>
                        <button onclick="deleteTask(${index})" class="btn btn-link text-danger p-0 border-0 fs-5">
                            ✕
                        </button>
                    `;
                    taskList.appendChild(li);
                });
            }
            localStorage.setItem('todo_tasks', JSON.stringify(tasks));
        }

        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (text) {
                tasks.push({ text, completed: false });
                taskInput.value = '';
                renderTasks();
            }
        });

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
        }

        renderTasks();
    </script>
</body>
</html>
